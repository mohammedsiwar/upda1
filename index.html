// ── SUGGESTED WEEKLY TEMPLATE (Mon gym, Tue hiit, Wed rest, Thu gym, Fri cardio, Sat walk, Sun rest) ──
function assignWeek(shifts){
  const SUGGESTED = ["off_gym1","off_hiit","off","off_gym2","off_hiit","off_walk","off"];
  const res = Array(7).fill(null);
  for(let i=0;i<7;i++){
    const s = shifts[i] || SUGGESTED[i];
    if(s==="off_gym1")   res[i]="gym1";
    else if(s==="off_gym2")   res[i]="gym2";
    else if(s==="off_hiit")   res[i]="home_hiit";
    else if(s==="off_walk")   res[i]="walk";
    else if(s==="babysitting") res[i]="home_hiit";
    else if(s==="morning"||s==="afternoon"||s==="night"||s==="double") res[i]="kfc";
    else res[i]="rest";
  }
  // Weekend override
  res[5]="walk";
  res[6]="rest";
  return res;
}

function getWeekDates(n){
  const now=new Date(),day=now.getDay(),mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+(n-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function fmtDate(d){return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function fmtElapsed(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

  if(name==="Brisk Walk"||name==="Jumping Jacks") return "🏃";
  if(name==="Kegel") return "🎯";
  if(name==="Joint Mobility") return "🔄";
  if(name==="Plank"||name==="Side Plank") return "🧘";
  if(name==="Squat"||name==="Bodyweight Squat"||name==="Deadlift") return "🦵";
  if(name==="Leg Raise"||name==="Russian Twist") return "🔥";
  if(name==="Push-ups") return "💪";
  if(name==="Lateral Raise") return "🙆";
  return "🏋️";
}

/* ═══════════════════════════════════════════════
   AUTH SCREEN
═══════════════════════════════════════════════ */
function AuthScreen(){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [confirm,setConfirm]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const inp = {width:"100%",background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,color:"#fff",padding:"13px 14px",fontSize:14,fontFamily:FB,marginBottom:10};
  async function submit(){
    setErr(""); setLoading(true);
    try{
      if(mode==="signup"){
        if(pass!==confirm){setErr("Passwords don't match");setLoading(false);return;}
        if(pass.length<6){setErr("Password min 6 characters");setLoading(false);return;}
        await fbSignUp(email,pass);
      } else { await fbSignIn(email,pass); }
    } catch(e){ setErr(e.message.replace("Firebase:","").replace(/\(.*\)/,"").trim()); }
    setLoading(false);
  }
  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20,fontFamily:FB}}>
      <div style={{textAlign:"center",marginBottom:36}}>
        <div style={{width:72,height:72,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent},${C.accent2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,margin:"0 auto 12px"}}>💪</div>
        <div style={{fontFamily:FD,fontSize:38,color:C.accent,letterSpacing:4}}>MOE FITNESS</div>
        <div style={{fontSize:11,color:C.muted,letterSpacing:3,marginTop:2}}>YOUR PERSONAL COMMAND CENTER</div>
      </div>
      <div style={{width:"100%",maxWidth:380,background:"#111",borderRadius:18,border:"1px solid #222",padding:26}} className="fade-in">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:22,background:"#0d0d0d",padding:4,borderRadius:10}}>
          {["login","signup"].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");}}
              style={{padding:"9px",borderRadius:7,background:mode===m?C.accent:"transparent",border:"none",color:mode===m?"#000":C.muted,fontFamily:FD,fontSize:15,letterSpacing:2,cursor:"pointer"}}>
              {m==="login"?"SIGN IN":"SIGN UP"}
            </button>
          ))}
        </div>
        <input placeholder="Email address" type="email" value={email} onChange={e=>setEmail(e.target.value)} style={inp}/>
        <input placeholder="Password" type="password" value={pass} onChange={e=>setPass(e.target.value)} style={inp}/>
        {mode==="signup"&&<input placeholder="Confirm password" type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} style={inp}/>}
        {err&&<div style={{fontSize:12,color:"#f87171",marginBottom:10,padding:"8px 12px",background:"#f8717111",borderRadius:8,border:"1px solid #f8717133"}}>{err}</div>}
        <button onClick={submit} disabled={loading}
          style={{width:"100%",padding:"14px",background:loading?C.dim:`linear-gradient(135deg,${C.accent},${C.accent2})`,border:"none",borderRadius:11,color:"#000",fontFamily:FD,fontSize:17,letterSpacing:3,cursor:loading?"not-allowed":"pointer",fontWeight:700}}>
          {loading?<span className="spin" style={{display:"inline-block",width:18,height:18,border:"2px solid #000",borderTopColor:"transparent",borderRadius:"50%"}}/>:mode==="login"?"LET'S GO →":"CREATE ACCOUNT →"}
        </button>
        <div style={{textAlign:"center",marginTop:16,fontSize:12,color:C.muted}}>
          {mode==="login"?"Don't have an account? ":"Already have an account? "}
          <span onClick={()=>{setMode(mode==="login"?"signup":"login");setErr("");}} style={{color:C.accent,cursor:"pointer",fontWeight:600}}>
            {mode==="login"?"Sign up":"Sign in"}
          </span>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   PROFILE SETUP
═══════════════════════════════════════════════ */
function ProfileSetup({user,onComplete}){
  const [step,setStep]=useState(0);
  const [data,setData]=useState({name:"",age:"",weight:"",weightUnit:"kg",height:"",heightUnit:"cm",gender:"Male",fitnessGoal:"General Fitness",fitnessLevel:"Beginner",injuries:"",workoutDays:[],workoutTime:"60min",preferredTime:"Morning"});
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState("");
  const set=(k,v)=>setData(d=>({...d,[k]:v}));
  const toggleDay=d=>set("workoutDays",data.workoutDays.includes(d)?data.workoutDays.filter(x=>x!==d):[...data.workoutDays,d]);
  const inp={width:"100%",background:"#161616",border:"1px solid #2a2a2a",borderRadius:10,color:"#fff",padding:"12px 14px",fontSize:14,fontFamily:FB,marginBottom:0};
  const sel={...inp,cursor:"pointer"};
  const label={fontSize:11,color:C.muted,letterSpacing:1,marginBottom:6,display:"block"};
  const field={marginBottom:16};
  const STEPS=[{title:"PERSONAL INFO",icon:"👤"},{title:"FITNESS GOALS",icon:"🎯"},{title:"YOUR SCHEDULE",icon:"📅"}];
  async function finish(){
    setSaving(true);setErr("");
    try{
      await fbSetDoc("users",user.uid,{...data,email:user.email,createdAt:serverTimestamp(),lastLogin:serverTimestamp(),profileComplete:true,weeks:{},completed:{},missed:{}});
      onComplete(data);
    }catch(e){setErr(e.message);}
    setSaving(false);
  }
  function validateStep(){
    if(step===0&&(!data.name||!data.age||!data.weight||!data.height)){setErr("Please fill all fields");return false;}
    if(step===2&&data.workoutDays.length===0){setErr("Select at least one workout day");return false;}
    setErr("");return true;
  }
  return(
    <div style={{minHeight:"100vh",background:C.bg,fontFamily:FB,padding:20,paddingBottom:40}}>
      <div style={{maxWidth:480,margin:"0 auto"}}>
        <div style={{textAlign:"center",padding:"24px 0 20px"}}>
          <div style={{fontFamily:FD,fontSize:32,color:C.accent,letterSpacing:3}}>COMPLETE PROFILE</div>
          <div style={{fontSize:11,color:C.muted,letterSpacing:2,marginTop:2}}>STEP {step+1} OF {STEPS.length}</div>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:24}}>
          {STEPS.map((s,i)=><div key={i} style={{flex:1,height:4,borderRadius:2,background:i<=step?C.accent:C.dim,transition:"background .3s"}}/>)}
        </div>
        <div style={{background:"#111",borderRadius:18,border:"1px solid #1e1e1e",padding:22}} className="fade-in">
          <div style={{fontFamily:FD,fontSize:20,color:C.accent,letterSpacing:2,marginBottom:18}}>{STEPS[step].icon} {STEPS[step].title}</div>
          {step===0&&(
            <>
              <div style={field}><label style={label}>FULL NAME</label><input style={inp} value={data.name} onChange={e=>set("name",e.target.value)} placeholder="Your name"/></div>
              <div style={field}><label style={label}>AGE</label><input style={inp} type="number" value={data.age} onChange={e=>set("age",e.target.value)} placeholder="Years" min="13" max="100"/></div>
              <div style={{...field,display:"grid",gridTemplateColumns:"1fr auto",gap:8}}>
                <div><label style={label}>WEIGHT</label><input style={inp} type="number" value={data.weight} onChange={e=>set("weight",e.target.value)} placeholder="Amount"/></div>
                <div><label style={label}>UNIT</label><select style={{...sel,width:70}} value={data.weightUnit} onChange={e=>set("weightUnit",e.target.value)}><option>kg</option><option>lbs</option></select></div>
              </div>
              <div style={{...field,display:"grid",gridTemplateColumns:"1fr auto",gap:8}}>
                <div><label style={label}>HEIGHT</label><input style={inp} type="number" value={data.height} onChange={e=>set("height",e.target.value)} placeholder="Amount"/></div>
                <div><label style={label}>UNIT</label><select style={{...sel,width:70}} value={data.heightUnit} onChange={e=>set("heightUnit",e.target.value)}><option>cm</option><option>ft</option></select></div>
              </div>
              <div style={field}><label style={label}>GENDER</label>
                <div style={{display:"flex",gap:7}}>
                  {["Male","Female","Other"].map(g=><button key={g} onClick={()=>set("gender",g)} style={{flex:1,padding:"10px",background:data.gender===g?`${C.accent}22`:C.dim,border:`1px solid ${data.gender===g?C.accent:"#333"}`,borderRadius:9,color:data.gender===g?C.accent:"#888",fontSize:12,cursor:"pointer",fontFamily:FB,fontWeight:600}}>{g}</button>)}
                </div>
              </div>
            </>
          )}
          {step===1&&(
            <>
              <div style={field}><label style={label}>FITNESS GOAL</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                  {["Weight Loss","Muscle Gain","Endurance","General Fitness"].map(g=><button key={g} onClick={()=>set("fitnessGoal",g)} style={{padding:"11px 8px",background:data.fitnessGoal===g?`${C.accent}22`:C.dim,border:`1px solid ${data.fitnessGoal===g?C.accent:"#333"}`,borderRadius:9,color:data.fitnessGoal===g?C.accent:"#888",fontSize:11,cursor:"pointer",fontFamily:FB,fontWeight:600,textAlign:"center"}}>{g}</button>)}
                </div>
              </div>
              <div style={field}><label style={label}>FITNESS LEVEL</label>
                <div style={{display:"flex",gap:7}}>
                  {["Beginner","Intermediate","Advanced"].map(l=><button key={l} onClick={()=>set("fitnessLevel",l)} style={{flex:1,padding:"10px 4px",background:data.fitnessLevel===l?`${C.accent}22`:C.dim,border:`1px solid ${data.fitnessLevel===l?C.accent:"#333"}`,borderRadius:9,color:data.fitnessLevel===l?C.accent:"#888",fontSize:11,cursor:"pointer",fontFamily:FB,fontWeight:600}}>{l}</button>)}
                </div>
              </div>
              <div style={field}><label style={label}>INJURIES / LIMITATIONS (optional)</label>
                <textarea value={data.injuries} onChange={e=>set("injuries",e.target.value)} placeholder="Any injuries or physical limitations?" style={{...inp,minHeight:80,resize:"none",lineHeight:1.5}}/>
              </div>
            </>
          )}
          {step===2&&(
            <>
              <div style={field}><label style={label}>WORKOUT DAYS</label>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {DAYS_SHORT.map(d=><button key={d} onClick={()=>toggleDay(d)} style={{padding:"8px 12px",background:data.workoutDays.includes(d)?`${C.accent}22`:C.dim,border:`1px solid ${data.workoutDays.includes(d)?C.accent:"#333"}`,borderRadius:8,color:data.workoutDays.includes(d)?C.accent:"#888",fontSize:11,cursor:"pointer",fontFamily:FD,letterSpacing:1}}>{d}</button>)}
                </div>
              </div>
              <div style={field}><label style={label}>AVAILABLE TIME PER DAY</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                  {["30min","45min","60min","90min+"].map(t=><button key={t} onClick={()=>set("workoutTime",t)} style={{padding:"10px",background:data.workoutTime===t?`${C.accent}22`:C.dim,border:`1px solid ${data.workoutTime===t?C.accent:"#333"}`,borderRadius:9,color:data.workoutTime===t?C.accent:"#888",fontSize:12,cursor:"pointer",fontFamily:FB,fontWeight:600}}>{t}</button>)}
                </div>
              </div>
              <div style={field}><label style={label}>PREFERRED WORKOUT TIME</label>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                  {["Morning","Afternoon","Evening","Late Night"].map(t=><button key={t} onClick={()=>set("preferredTime",t)} style={{padding:"10px",background:data.preferredTime===t?`${C.accent}22`:C.dim,border:`1px solid ${data.preferredTime===t?C.accent:"#333"}`,borderRadius:9,color:data.preferredTime===t?C.accent:"#888",fontSize:11,cursor:"pointer",fontFamily:FB,fontWeight:600}}>{t}</button>)}
                </div>
              </div>
            </>
          )}
          {err&&<div style={{fontSize:12,color:"#f87171",marginBottom:10,padding:"8px 12px",background:"#f8717111",borderRadius:8,border:"1px solid #f8717133"}}>{err}</div>}
          <div style={{display:"grid",gridTemplateColumns:step>0?"1fr 1fr":"1fr",gap:8,marginTop:8}}>
            {step>0&&<button onClick={()=>{setStep(s=>s-1);setErr("");}} style={{padding:"13px",background:C.dim,border:"1px solid #333",borderRadius:11,color:"#aaa",fontFamily:FD,fontSize:15,letterSpacing:2,cursor:"pointer"}}>← BACK</button>}
            <button onClick={()=>{if(!validateStep())return;if(step<STEPS.length-1)setStep(s=>s+1);else finish();}} disabled={saving}
              style={{padding:"13px",background:saving?C.dim:`linear-gradient(135deg,${C.accent},${C.accent2})`,border:"none",borderRadius:11,color:"#000",fontFamily:FD,fontSize:15,letterSpacing:2,cursor:saving?"not-allowed":"pointer",fontWeight:700}}>
              {saving?"SAVING...":(step<STEPS.length-1?"NEXT →":"FINISH & START 🚀")}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   FLOATING TIMER BAR
   — Runs in background, never blocks the app.
   — Collapsed: slim pill above bottom nav.
   — Expanded: taller panel with controls, still
     not full-screen so you can see the content.
═══════════════════════════════════════════════ */
function FloatingTimerBar({restTimer,sessionTimer,onRestClose,onSessionClose,onRestChange}){
  const [expanded,setExpanded]=useState(false);

  // ── REST TIMER state (countdown) ──
  const [restRem,setRestRem]=useState(restTimer||0);
  const [restRun,setRestRun]=useState(true);
  const [restDone,setRestDone]=useState(false);
  const restRef=useRef(null);
  const prevRestTimer=useRef(restTimer);

  // Reset rest state when a new restTimer value is launched
  useEffect(()=>{
    if(restTimer!==null && restTimer!==prevRestTimer.current){
      clearInterval(restRef.current);
      setRestRem(restTimer);
      setRestRun(true);
      setRestDone(false);
      prevRestTimer.current=restTimer;
      setExpanded(true);
    }
  },[restTimer]);

  useEffect(()=>{
    if(restTimer===null) return;
    if(restRun&&restRem>0){
      restRef.current=setInterval(()=>{
        setRestRem(r=>{
          if(r<=1){clearInterval(restRef.current);setRestDone(true);setRestRun(false);return 0;}
          return r-1;
        });
      },1000);
    }
    return()=>clearInterval(restRef.current);
  },[restRun,restTimer]);

  function restToggle(){clearInterval(restRef.current);setRestRun(r=>!r);}
  function restReset(){
    clearInterval(restRef.current);
    setRestRem(restTimer||0);
    setRestRun(true);
    setRestDone(false);
  }

  // ── SESSION TIMER state (countup) ──
  const [sessElapsed,setSessElapsed]=useState(0);
  const [sessRun,setSessRun]=useState(true);
  const sessRef=useRef(null);
  const prevSessTimer=useRef(sessionTimer);

  useEffect(()=>{
    if(sessionTimer && sessionTimer!==prevSessTimer.current){
      clearInterval(sessRef.current);
      setSessElapsed(0);
      setSessRun(true);
      prevSessTimer.current=sessionTimer;
      setExpanded(true);
    }
  },[sessionTimer]);

  useEffect(()=>{
    if(!sessionTimer) return;
    if(sessRun){sessRef.current=setInterval(()=>setSessElapsed(e=>e+1),1000);}
    else{clearInterval(sessRef.current);}
    return()=>clearInterval(sessRef.current);
  },[sessRun,sessionTimer]);

  // Nothing active → render nothing
  if(restTimer===null && !sessionTimer) return null;

  const hasRest=restTimer!==null;
  const hasSess=!!sessionTimer;
  const restPct=hasRest?(restRem/(restTimer||1)):0;
  const restColor=restDone?C.accent:restRem<=10?"#f87171":C.accent;
  const R=20, circ=2*Math.PI*R;

  return(
    <div style={{
      position:"fixed",bottom:56,left:"50%",transform:"translateX(-50%)",
      width:"calc(100% - 24px)",maxWidth:456,
      zIndex:8000,
      borderRadius: expanded?18:40,
      background:"#141414",
      border:`1px solid ${hasRest?restColor:sessionTimer?.color||C.accent}44`,
      boxShadow:`0 4px 32px rgba(0,0,0,0.7), 0 0 0 1px ${hasRest?restColor:sessionTimer?.color||C.accent}22`,
      overflow:"hidden",
      transition:"border-radius .25s, box-shadow .25s",
    }}>

      {/* ── COLLAPSED PILL (always visible) ── */}
      <div onClick={()=>setExpanded(e=>!e)}
        style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",cursor:"pointer",userSelect:"none"}}>

        {/* Rest ring */}
        {hasRest&&(
          <div style={{position:"relative",width:44,height:44,flexShrink:0}}>
            <svg width="44" height="44" style={{transform:"rotate(-90deg)"}}>
              <circle cx="22" cy="22" r={R} fill="none" stroke="#2a2a2a" strokeWidth="4"/>
              <circle cx="22" cy="22" r={R} fill="none" stroke={restColor} strokeWidth="4"
                strokeDasharray={circ} strokeDashoffset={circ*(1-restPct)}
                strokeLinecap="round" style={{transition:"stroke-dashoffset 1s linear,stroke .4s"}}/>
            </svg>
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span style={{fontFamily:FD,fontSize:14,color:restColor,lineHeight:1}}>{restDone?"✓":restRem}</span>
            </div>
          </div>
        )}

        {/* Labels */}
        <div style={{flex:1,minWidth:0}}>
          {hasRest&&(
            <div style={{fontFamily:FD,fontSize:11,color:restColor,letterSpacing:2,lineHeight:1.2}}>
              {restDone?"✅ REST DONE — GO AGAIN!":(restRun?"⏱ REST":"⏸ PAUSED")}
              {!restDone&&` · ${restRem}s`}
            </div>
          )}
          {hasSess&&(
            <div style={{fontFamily:FD,fontSize:11,color:sessionTimer.color,letterSpacing:2,lineHeight:1.2,marginTop:hasRest?3:0}}>
              {sessRun?"🔥":"⏸"} SESSION · {fmtElapsed(sessElapsed)}
            </div>
          )}
        </div>

        {/* Quick controls (always accessible without expanding) */}
        <div style={{display:"flex",gap:5,flexShrink:0}} onClick={e=>e.stopPropagation()}>
          {hasRest&&!restDone&&(
            <button onClick={restToggle}
              style={{width:32,height:32,borderRadius:"50%",background:restRun?"#2a2a2a":"#b8d44a22",border:`1px solid ${restRun?"#333":C.accent}`,color:restRun?"#aaa":C.accent,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {restRun?"⏸":"▶"}
            </button>
          )}
          {hasSess&&(
            <button onClick={()=>setSessRun(r=>!r)}
              style={{width:32,height:32,borderRadius:"50%",background:sessRun?`${sessionTimer.color}22`:"#2a2a2a",border:`1px solid ${sessRun?sessionTimer.color:"#333"}`,color:sessRun?sessionTimer.color:"#aaa",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {sessRun?"⏸":"▶"}
            </button>
          )}
          <button onClick={e=>{e.stopPropagation();setExpanded(ex=>!ex);}}
            style={{width:32,height:32,borderRadius:"50%",background:"#1e1e1e",border:"1px solid #333",color:"#555",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {expanded?"▼":"▲"}
          </button>
        </div>
      </div>

      {/* ── EXPANDED PANEL ── */}
      {expanded&&(
        <div style={{borderTop:"1px solid #222",padding:"12px 14px 14px"}} onClick={e=>e.stopPropagation()}>

          {/* REST TIMER expanded */}
          {hasRest&&(
            <div style={{marginBottom:hasSess?14:0}}>
              <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:8}}>REST TIMER</div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                {/* Big ring */}
                <div style={{position:"relative",width:80,height:80,flexShrink:0}}>
                  <svg width="80" height="80" style={{transform:"rotate(-90deg)"}}>
                    <circle cx="40" cy="40" r="34" fill="none" stroke="#2a2a2a" strokeWidth="6"/>
                    <circle cx="40" cy="40" r="34" fill="none" stroke={restColor} strokeWidth="6"
                      strokeDasharray={2*Math.PI*34} strokeDashoffset={2*Math.PI*34*(1-restPct)}
                      strokeLinecap="round" style={{transition:"stroke-dashoffset 1s linear,stroke .4s"}}/>
                  </svg>
                  <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                    <span style={{fontFamily:FD,fontSize:restDone?16:28,color:restColor,lineHeight:1}}>{restDone?"✅":restRem}</span>
                    {!restDone&&<span style={{fontSize:8,color:"#555",letterSpacing:1}}>SEC</span>}
                  </div>
                </div>
                <div style={{flex:1}}>
                  {restDone&&<div style={{fontFamily:FD,fontSize:14,color:C.accent,letterSpacing:2,marginBottom:8}} className="timer-pop">GO AGAIN! 💪</div>}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                    <button onClick={restToggle}
                      style={{padding:"9px 4px",background:"#1e1e1e",border:"1px solid #333",borderRadius:9,color:"#fff",fontFamily:FD,fontSize:13,cursor:"pointer"}}>
                      {restRun?"⏸":"▶"}
                    </button>
                    <button onClick={restReset}
                      style={{padding:"9px 4px",background:"#1e1e1e",border:"1px solid #333",borderRadius:9,color:"#aaa",fontFamily:FD,fontSize:13,cursor:"pointer"}}>↺</button>
                    <button onClick={()=>{clearInterval(restRef.current);onRestClose();}}
                      style={{padding:"9px 4px",background:"#f8717118",border:"1px solid #f8717144",borderRadius:9,color:"#f87171",fontFamily:FD,fontSize:13,cursor:"pointer"}}>✕</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SESSION TIMER expanded */}
          {hasSess&&(
            <div>
              {hasRest&&<div style={{height:1,background:"#222",margin:"0 0 12px"}}/>}
              <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:8}}>SESSION TIMER</div>

              <div style={{fontSize:10,color:C.muted,marginTop:3}}>{profile.fitnessLevel||"FITNESS"} ATHLETE · {profile.fitnessGoal||"FITNESS"}</div>
            </div>
            {!editProf?(
              <>
                {[["👤 Full Name",profile.name],["🎂 Age",`${profile.age} years`],["⚖️ Weight",`${profile.weight} ${profile.weightUnit||"kg"}`],["📏 Height",`${profile.height} ${profile.heightUnit||"cm"}`],["🎯 Goal",profile.fitnessGoal||profile.target],["🏆 Level",profile.fitnessLevel],["⏰ Best time",profile.preferredTime],["📅 Workout days",profile.workoutDays?.join(", ")],["🩹 Limitations",profile.injuries||"None"]].map(([l,v])=>(
                  <div key={l} style={{...cs,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
                    <div style={{fontSize:11,color:C.muted,whiteSpace:"nowrap"}}>{l}</div>
                    <div style={{fontSize:12,color:"#fff",fontWeight:600,textAlign:"right"}}>{v||"—"}</div>
                  </div>
                ))}
                <button onClick={()=>{setProfDraft({...profile});setEditProf(true);}}
                  style={{width:"100%",padding:"12px",background:`${C.accent}1a`,border:`1px solid ${C.accent}44`,borderRadius:11,color:C.accent,fontFamily:FD,fontSize:16,letterSpacing:2,cursor:"pointer",marginTop:4}}>
                  ✏️ EDIT PROFILE
                </button>
                <button onClick={onSignOut}
                  style={{width:"100%",padding:"12px",background:"#f8717111",border:"1px solid #f8717133",borderRadius:11,color:"#f87171",fontFamily:FD,fontSize:16,letterSpacing:2,cursor:"pointer",marginTop:8}}>
                  🚪 SIGN OUT
                </button>
              </>
            ):(
              <>
                {[["Full Name","name","text"],["Age","age","number"],["Weight","weight","number"],["Height","height","number"]].map(([lb,k,t])=>(
                  <div key={k} style={{marginBottom:12}}>
                    <div style={{fontSize:9,color:C.muted,letterSpacing:1,marginBottom:4}}>{lb.toUpperCase()}</div>
                    <input type={t} value={profDraft[k]||""} onChange={e=>setProfDraft(p=>({...p,[k]:e.target.value}))}
                      style={{width:"100%",background:"#1a1a1a",border:"1px solid #333",borderRadius:8,color:"#fff",padding:"10px 12px",fontSize:12}}/>
                  </div>
                ))}
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:9,color:C.muted,letterSpacing:1,marginBottom:4}}>FITNESS GOAL</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {["Weight Loss","Muscle Gain","Endurance","General Fitness"].map(g=>(
                      <button key={g} onClick={()=>setProfDraft(p=>({...p,fitnessGoal:g}))}
                        style={{padding:"9px 6px",background:profDraft.fitnessGoal===g?`${C.accent}22`:C.dim,border:`1px solid ${profDraft.fitnessGoal===g?C.accent:"#333"}`,borderRadius:8,color:profDraft.fitnessGoal===g?C.accent:"#888",fontSize:10,cursor:"pointer",fontFamily:FB}}>
                        {g}
                      </button>
                    ))}
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginTop:8}}>
                  <button onClick={()=>setEditProf(false)} style={{padding:"11px",background:"#1a1a1a",border:"1px solid #333",borderRadius:10,color:"#aaa",fontFamily:FD,fontSize:14,cursor:"pointer"}}>CANCEL</button>
                  <button onClick={saveProf} style={{padding:"11px",background:`linear-gradient(135deg,${C.accent},${C.accent2})`,border:"none",borderRadius:10,color:"#000",fontFamily:FD,fontSize:14,cursor:"pointer",fontWeight:700}}>SAVE</button>
                </div>
              </>
            )}
          </div>
        )}

        {/* BOTTOM NAV */}
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#0d0d0d",borderTop:`1px solid ${C.border}`,display:"flex"}}>
          {[["today","⚡","TODAY"],["schedule","📅","SCHED"],["plan","💪","PLAN"],["progress","📊","PROG"],["profile","👤","ME"]].map(([k,ic,lb])=>(
            <button key={k} onClick={()=>setTab(k)}
              style={{flex:1,padding:"8px 4px",background:"none",border:"none",color:tab===k?C.accent:C.dim,cursor:"pointer",borderTop:`2px solid ${tab===k?C.accent:"transparent"}`}}>
              <div style={{fontSize:15}}>{ic}</div>
              <div style={{fontSize:8,letterSpacing:1,marginTop:1}}>{lb}</div>
            </button>
          ))}
        </div>

        {/* MISSED MODAL */}
        {missedModal!==null&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:1000}} onClick={()=>setMissedModal(null)}>
            <div style={{width:"100%",maxWidth:480,background:"#141414",borderRadius:"18px 18px 0 0",padding:20,border:"1px solid #2a2a2a"}} onClick={e=>e.stopPropagation()}>
              <div style={{fontFamily:FD,fontSize:18,color:"#f87171",letterSpacing:2,marginBottom:3}}>LOG MISSED</div>
              <div style={{fontSize:11,color:C.muted,marginBottom:11}}>{DAYS_FULL[missedModal]}</div>
              <textarea value={missedNote} onChange={e=>setMissedNote(e.target.value)} placeholder="Why? (optional)"
                style={{width:"100%",background:"#1a1a1a",border:"1px solid #333",borderRadius:9,color:"#fff",padding:10,fontSize:12,minHeight:64,resize:"none"}}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginTop:9}}>
                <button onClick={()=>setMissedModal(null)} style={{padding:"11px",background:"#1a1a1a",border:"1px solid #333",borderRadius:9,color:"#aaa",fontFamily:FD,fontSize:13,cursor:"pointer"}}>CANCEL</button>
                <button onClick={()=>logMissed(missedModal,missedNote)} style={{padding:"11px",background:"#f8717122",border:"1px solid #f87171",borderRadius:9,color:"#f87171",fontFamily:FD,fontSize:13,cursor:"pointer"}}>LOG IT</button>
              </div>
            </div>
          </div>
        )}

        {/* TOAST */}
        {toast&&(
          <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:toast.color,color:"#000",padding:"8px 18px",borderRadius:26,fontFamily:FD,fontSize:13,letterSpacing:1,zIndex:9999,fontWeight:700,whiteSpace:"nowrap",pointerEvents:"none"}}>
            {toast.msg}
          </div>
        )}
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════ */
function App(){
  const [authState,setAuthState]=useState("loading");
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);

  useEffect(()=>{
    const unsub=fbOnAuth(async fireUser=>{
      if(!fireUser){setAuthState("auth");return;}
      setUser(fireUser);
      try{
        const docSnap=await fbGetDoc("users",fireUser.uid);
        if(docSnap.exists()&&docSnap.data().profileComplete){
          const data=docSnap.data();
          setProfile(data);
          if(data.appData){
            try{
              const existing=JSON.parse(localStorage.getItem("mf_data_"+fireUser.uid))||{};
              if(!Object.keys(existing).length){localStorage.setItem("mf_data_"+fireUser.uid,JSON.stringify(data.appData));}
            }catch{}
          }
          setAuthState("app");
        } else { setAuthState("setup"); }
        fbUpdateDoc("users",fireUser.uid,{lastLogin:serverTimestamp()}).catch(()=>{});
      }catch(e){ setAuthState("setup"); }
    });
    return()=>unsub();
  },[]);

  async function handleSignOut(){ await fbSignOut(); setUser(null);setProfile(null);setAuthState("auth"); }

  if(authState==="loading") return <LoadingScreen/>;
  if(authState==="auth")    return <AuthScreen/>;
  if(authState==="setup")   return <ProfileSetup user={user} onComplete={p=>{setProfile(p);setAuthState("app");}}/>;
  return <MoeFitness user={user} profile={profile} onSignOut={handleSignOut}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
} // end startApp()

if (window._fbReady) { startApp(); }
else {
  document.addEventListener("firebase-ready",()=>{window._fbReady=true;startApp();},{once:true});
  document.addEventListener("firebase-error",()=>startApp(),{once:true});
  setTimeout(()=>{if(!window._fbReady)startApp();},12000);
}
</script>
</body>
